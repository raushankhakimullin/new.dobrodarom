name: Build & Deploy to Beget (dobrodarom.ru)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Diagnostics
        working-directory: artifacts/dobro-darom
        continue-on-error: true
        run: |
          echo "=== node version ===" && node --version
          echo "=== vite binary ===" && ls -la node_modules/.bin/vite || echo "MISSING"
          echo "=== vite version ===" && node_modules/.bin/vite --version || echo "FAILED"
          echo "=== @workspace/api-client-react ===" && ls node_modules/@workspace/api-client-react 2>/dev/null || echo "NOT LINKED"
          echo "=== replit plugins ===" && ls node_modules/@replit 2>/dev/null || echo "NOT FOUND"

      - name: Build frontend
        working-directory: artifacts/dobro-darom
        run: |
          node_modules/.bin/vite build --config vite.config.ts 2>&1
        env:
          NODE_ENV: production
          PORT: '3000'
          BASE_PATH: '/'

      - name: Create .htaccess in dist
        run: |
          cat > artifacts/dobro-darom/dist/public/.htaccess << 'HTACCESS'
          AddDefaultCharset UTF-8
          AddType application/javascript .js .mjs
          AddType text/css .css
          AddType image/svg+xml .svg
          AddType image/webp .webp
          AddType font/woff2 .woff2

          Header always set X-Content-Type-Options "nosniff"
          Header always set X-Frame-Options "SAMEORIGIN"
          Header always set Referrer-Policy "strict-origin-when-cross-origin"

          <FilesMatch "\.(js|css|woff2|jpg|jpeg|png|svg|webp|gif|ico)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
          </FilesMatch>
          <FilesMatch "^index\.html$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
          </FilesMatch>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
          </IfModule>

          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.html [L]
          </IfModule>
          HTACCESS

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BEGET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22" \
            artifacts/dobro-darom/dist/public/ \
            "${{ secrets.BEGET_USERNAME }}@${{ secrets.BEGET_HOST }}:${{ secrets.BEGET_DEPLOY_PATH }}/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
